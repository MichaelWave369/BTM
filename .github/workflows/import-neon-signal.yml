name: Initialize BTM from verified v0.4.1 source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-neon-signal.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verified-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download the released game's public source archive
        run: |
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            --output "$RUNNER_TEMP/neon-source.zip" \
            'https://michael-wave-ori-break-the-matrix.microneesia79.chatgpt.site/game-source.zip'
      - name: Match every source file to the user's v0.4.1 snapshot
        env:
          SOURCE_ARCHIVE: ${{ runner.temp }}/neon-source.zip
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, zipfile
          archive=pathlib.Path(os.environ['SOURCE_ARCHIVE'])
          root='MichaelWave-Ori-BreakTheMatrix/'
          expected='df03cf0429424125125e884be8ac6ddda1531f5c2bba2c15aeae46055873c6d5'
          archive_sha=hashlib.sha256(archive.read_bytes()).hexdigest()
          if archive_sha!='a4f4c75f46c060c5e002375d985cd0c68d2d6c28ef12d269b9c5615f0cfd1b5b':
              raise SystemExit('Published game source archive differs from uploaded v0.4.1 snapshot')
          with zipfile.ZipFile(archive) as z:
              infos=z.infolist()
              if len(infos)>500 or len({i.filename for i in infos})!=len(infos):
                  raise SystemExit('Archive exceeds entry count or has duplicate paths')
              files={}
              for info in infos:
                  name=info.filename
                  if not name.startswith(root) or '\\' in name:
                      raise SystemExit('Unexpected source path: '+name)
                  rel=name[len(root):]
                  if not rel or info.is_dir() or rel.startswith('dist/'):
                      continue
                  parts=pathlib.PurePosixPath(rel).parts
                  if rel.startswith('/') or any(p in ('.','..') for p in parts):
                      raise SystemExit('Unsafe source path: '+name)
                  if ((info.external_attr >> 16) & 0o170000)==0o120000:
                      raise SystemExit('Symlink not allowed: '+name)
                  if info.file_size>3*1024*1024:
                      raise SystemExit('Oversized source file: '+name)
                  files[rel]=z.read(info)
          fingerprint=hashlib.sha256(''.join(
              f'{name}\0{hashlib.sha256(data).hexdigest()}\n'
              for name,data in sorted(files.items())
          ).encode()).hexdigest()
          print('Source files:',len(files),'Snapshot fingerprint:',fingerprint)
          if len(files)!=182 or fingerprint!=expected:
              raise SystemExit('LIVE SOURCE DOES NOT MATCH v0.4.1 USER ZIP. Refusing to import altered game.')
          for name,data in files.items():
              if name.startswith('.github/workflows/'):
                  continue # Import workflows are installed separately with GitHub App authorization.
              path=pathlib.Path(name)
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
          print('Verified source copied to repository workspace')
          PY
      - name: Validate the imported game without dependencies
        run: |
          npm run check
          npm test
          npm run build
          node scripts/verify-build.mjs
          node scripts/verify-offline.mjs
      - name: Commit the full verified source to BTM main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'feat: import complete v0.4.1 Neon Signal source and tests'
          git push origin HEAD:main
