<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>v0.4.0 / Immersive Verification</title><style>body{background:#07130f;color:#cfe6c4;font:14px monospace;margin:24px;line-height:1.6}h1{color:#b9ff53}button{padding:12px;margin:5px;background:#153529;color:#d8efc3;border:1px solid #6c9673;font:inherit}canvas{max-width:100%;border:1px solid #658c68;image-rendering:pixelated}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#5df6ec}</style><h1>ENTER THE FIELD / v0.4.0</h1><p>Reconstructed development candidate. Synthetic XR poses and real shared simulation; this page never changes saved games. Actual browser WebGL and physical headset acceptance are reported separately.</p><nav><button id="checks">RUN IMMERSIVE CHECKS</button><button id="campaign">RUN 12 TRACKED SECTORS</button><button id="failure">RUN TRACKED DEATH / RETRY</button><button id="graphics">CHECK REAL BROWSER WEBGL</button><button id="save">SAVE CURRENT REPORT</button><button id="export">EXPORT SOFTWARE RENDER FIXTURE</button><a href="./qa.html">Classic / Xbox / Arcade QA</a> · <a href="./">Play</a></nav><p id="summary" role="status">Ready.</p><canvas id="world" width="640" height="360"></canvas><pre id="raw"></pre><script type="module">
import{browserImmersiveChecks}from'./tests/immersive-checks.js';import{TrackedGame,runImmersiveFailure}from'./tests/immersive-playthrough.js';import{CampaignDriver}from'./tests/playthrough.js';import{worldFixture}from'./tests/world-fixture.js';import{VRWorldRenderer}from'./src/vr-world-renderer.js';import{Game}from'./src/core.js';import{ImmersiveRig}from'./src/immersive-rig.js';import{identity,perspective}from'./src/vr-math.js';
const $=id=>document.getElementById(id),report=data=>{$('raw').textContent=JSON.stringify(data,null,2);$('summary').textContent=(data.passed===true?'PASS':data.status||'FAIL')+' / '+(data.total?data.total+' checks':data.error||data.method||'See report');};
$('checks').onclick=async()=>report(await browserImmersiveChecks());$('failure').onclick=()=>report(runImmersiveFailure());
$('campaign').onclick=()=>{const game=new TrackedGame(),d=new CampaignDriver({game,sectors:12,secrets:true});function advance(){for(let i=0;i<512&&!d.done;i++)d.tick();$('summary').textContent='TRACKED TRAVERSAL / SECTOR '+(game.levelIndex+1)+'/12';if(!d.done)requestAnimationFrame(advance);else report({...d.report(),adapterSteps:game.adapterSteps,method:'Synthetic XR poses/sticks through the production immersive adapter at speed 1.0. Live AI/combat/objectives/pickups/secrets/bosses/deaths/retries/transitions. No player/HP/objective writes; no physical headset validation.'});}requestAnimationFrame(advance);};
$('graphics').onclick=()=>{let renderer;try{renderer=new VRWorldRenderer($('world'));const results=[];for(let i=0;i<12;i++){const game=new Game();game.loadLevel(i,false);const rig=new ImmersiveRig(),head=identity(),right=identity();head[13]=1.65;right[13]=1.4;right[14]=-.22;rig.prepare(game,{head,rightRay:right},null,{},.014);const views=[-.032,.032].map((x,index)=>{const inverse=identity();inverse[12]=-x;inverse[13]=-1.65;return{viewport:{x:index*320,y:0,width:320,height:360},projectionMatrix:perspective(Math.PI/2,320/360),transform:{inverse:{matrix:inverse}}};});const stats=renderer.renderWorld(views,game,rig,.014,{game,settings:{},screen:'',activate:()=>{}}),gl=renderer.gl,pixel=new Uint8Array(4);gl.readPixels(160,180,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);results.push({sector:i+1,pass:gl.getError()===gl.NO_ERROR&&pixel[0]+pixel[1]+pixel[2]>4,...stats});}report({passed:results.every(r=>r.pass),total:12,results,method:'Actual browser WebGL renderer and two synthetic eye views. No headset.'});}catch(e){report({passed:null,status:e.message==='WebGL is unavailable.'?'UNAVAILABLE':'FAIL',error:e.message,method:'Actual browser capability check; no headset/software substitute.'});}finally{renderer?.dispose();}};
const download=(name,text)=>{const blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('save').onclick=()=>download('immersive-browser-report.json',$('raw').textContent);$('export').onclick=()=>{const f=worldFixture(),text=JSON.stringify(f);download('immersive-world-fixture.json',text);report({passed:true,sectors:f.sectors.length,bytes:text.length,method:'Exported production meshes/atlases and synthetic stereo matrices for separate software GLES verification.'});};
</script></html>
