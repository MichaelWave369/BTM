<!doctype html><html lang="en"><meta charset="utf-8"><title>Pit of Despair / production verification</title><style>body{background:#090e1b;color:#eff4ff;font:15px monospace;margin:20px}button,select{font:inherit;background:#202f47;color:#fff;padding:10px;margin:4px}canvas{display:block;max-width:100%;margin:12px 0;border:1px solid #46617c}#world{width:1280px}pre{white-space:pre-wrap}h1{color:#ffb45e}</style><h1>PIT OF DESPAIR / THE TWELVE TRIALS</h1><p>Actual BTM simulation and Canvas/WebGL renderers. Synthetic stereo; no physical Quest acceptance. QA drivers keep their checkpoint ledger in memory.</p><select id="stage"></select><button id="preview">PREVIEW TRIAL</button><button id="classic-run">PLAY CLASSIC CAMPAIGN</button><button id="immersive-run">PLAY TRACKED CAMPAIGN</button><p id="status">Ready.</p><canvas id="world" width="1280" height="720"></canvas><canvas id="classic" width="640" height="360"></canvas><pre id="raw"></pre><script type="module">
import{Game,lineOfSight,angleDiff,distance}from'./src/core.js';import{PIT_STAGES,PIT_BOSSES}from'./src/pit.js';import{PitDriver}from'./tests/pit-playthrough.js';import{Renderer}from'./src/renderer.js';import{VRWorldRenderer}from'./src/vr-world-renderer.js';import{ImmersiveRig}from'./src/immersive-rig.js';import{matIdentity}from'./src/immersive-math.js';import{perspective}from'./src/vr-math.js';
const $=id=>document.getElementById(id),flat=new Renderer($('classic')),world=new VRWorldRenderer($('world')),rig=new ImmersiveRig(),head=matIdentity(),right=matIdentity(),left=matIdentity();head[13]=1.65;right[12]=.18;right[13]=1.3;right[14]=-.3;left[12]=-.22;left[13]=1;left[14]=-.4;
const settings={reducedMotion:true,vrQuality:'balanced',vrAimLine:false,vrEyeHeight:1.65},tracked={head,rightRay:right,rightGrip:right,leftGrip:left,leftRay:left};let current=null,frame=0,lastMetrics=null;
PIT_STAGES.forEach((d,i)=>$('stage').add(new Option((i+1)+'. '+d.name,i)));
// Re-anchor the capture camera at the driver's real pose; omit entry fade while simulation is frozen.
function draw(){if(!current)return;const g=current,view=Object.create(g);view.clearCombatPose=()=>{};view.setCombatPose=()=>{};rig.recenter();rig.prepare(view,tracked,null,settings,.016,false);rig.fade=0;const views=[-.032,.032].map((x,i)=>{const m=matIdentity();m[12]=-x;m[13]=-1.65;return{viewport:{x:i*640,y:0,width:640,height:720},projectionMatrix:perspective(Math.PI/2,640/720),transform:{inverse:{matrix:m}}};});const stats=world.renderWorld(views,g,rig,.016,{game:g,settings,screen:'',dialogue:'ORI: '+(g.definition.boss?PIT_BOSSES[g.definition.boss].tip:g.definition.subtitle),communications:[],activate:()=>{}});flat.draw(g,.016,{...settings,externalMap:true});const gl=world.gl,pixels=new Uint8Array(1280*720*4);gl.readPixels(0,0,1280,720,gl.RGBA,gl.UNSIGNED_BYTE,pixels);let leftHash=0,rightHash=0,lit=0;for(let y=0;y<720;y+=8)for(let x=0;x<640;x+=8){const a=(y*1280+x)*4,b=a+2560;leftHash=(Math.imul(leftHash,31)+pixels[a]+pixels[a+1]*7+pixels[a+2]*13)|0;rightHash=(Math.imul(rightHash,31)+pixels[b]+pixels[b+1]*7+pixels[b+2]*13)|0;if(pixels[a]+pixels[a+1]+pixels[a+2]>30)lit++;}lastMetrics={stage:g.levelIndex+1,name:g.definition.name,campaign:g.campaign,time:g.time,health:g.player.health,charge:g.player.energy,reserve:g.player.reserve,boss:g.level.enemies.filter(e=>e.pitBoss).map(e=>({id:e.pitBoss,phase:e.phase,hp:e.hp,exposed:e.exposed,dead:e.dead})),glError:gl.getError(),leftHash,rightHash,lit,stats:structuredClone(stats)};$('status').textContent='TRIAL '+(g.levelIndex+1)+' / '+g.definition.name+' / CHARGE '+Math.floor(g.player.energy)+' / RESERVE '+Math.floor(g.player.reserve);}
function animate(){draw();frame=requestAnimationFrame(animate);}window.pitPreview=index=>{const g=new Game();g.startPit();g.loadLevel(index,false);current=g;draw();return lastMetrics;};
window.pitMetrics=()=>lastMetrics;
// Replay a checkpoint captured from real driven gameplay without staging entities.
window.restorePitReplay=snapshot=>{const g=new Game();g.restore(snapshot,{campaign:'pit'});current=g;draw();return lastMetrics;};
window.runPit=async(immersive=false)=>{const errors=[],d=new PitDriver({immersive});window.playedPit=d;const entries=new Set(),bosses=new Set();let ticks=0;
 while(!d.done){d.tick();const g=d.game,currentStage=g.levelIndex;
  let kind=null;if(!entries.has(currentStage)){entries.add(currentStage);kind='trial';}
  const boss=g.level.enemies.find(e=>e.pitBoss&&!e.dead);if(boss&&boss.phase>=2&&boss.exposed>0&&distance(g.player,boss)>1.3&&lineOfSight(g.level,g.player,boss)&&Math.abs(angleDiff(Math.atan2(boss.y-g.player.y,boss.x-g.player.x),g.player.a))<.45&&!bosses.has(boss.pitBoss)){bosses.add(boss.pitBoss);kind='boss';}
  if(kind){current=g;draw();await new Promise(requestAnimationFrame);await window.capturePit?.(kind,currentStage+1,immersive,lastMetrics);}
  if(++ticks%300===0)await new Promise(requestAnimationFrame);
 }
 current=d.game;draw();const report=d.report();report.rendererErrors=errors;$('raw').textContent=JSON.stringify(report,null,2);return report;
};
$('preview').onclick=()=>window.pitPreview(Number($('stage').value));$('classic-run').onclick=()=>window.runPit(false);$('immersive-run').onclick=()=>window.runPit(true);window.pitPreview(0);animate();window.addEventListener('pagehide',()=>{cancelAnimationFrame(frame);world.dispose();});
</script></html>
