<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fieldlink / Production Equipment Verification</title><style>@font-face{font-family:Oxanium;src:url('./fonts/Oxanium.ttf');font-weight:200 800}body{margin:20px;background:#07111e;color:#edf8ff;font:15px monospace}h1,a{color:#4be7ff}button,select{font:inherit;padding:10px;margin:4px;color:#edf8ff;background:#172b3e;border:1px solid #658ca4}canvas{display:block;max-width:100%;margin:12px 0;border:1px solid #55758c}pre{white-space:pre-wrap}#world{width:1280px}#wrist,#comm{width:640px}</style>
<h1>FIELDLINK / EQUIPMENT LAB</h1><p>Actual production geometry, Canvas interfaces and WebGL stereo. Simulated tracked poses; no saved games or physical Quest acceptance.</p><nav><label>Pose <select id="pose"><option>combat</option><option>hands</option><option>wrist</option><option>dialogue</option></select></label><label>Weapon <select id="weapon"></select></label><label>Glove <select id="style"><option value="combat">Cybernetic Combat</option><option value="neon">Neon Signal</option><option value="tactical">Minimal Tactical</option></select></label><button id="render">SHOW EQUIPMENT</button><button id="checks">RUN EQUIPMENT CHECKS</button><a href="./immersive-next-qa.html">Full sector renderer QA</a></nav><p id="status" role="status">Ready.</p><canvas id="world" width="1280" height="720"></canvas><canvas id="wrist" width="768" height="512"></canvas><canvas id="comm" width="1280" height="360"></canvas><pre id="raw"></pre><script type="module">
import {visualLeftPose} from './src/left-hand-pose.js';import {Game,WEAPONS} from './src/core.js';import {VRWorldRenderer} from './src/vr-world-renderer.js';import {ImmersiveRig} from './src/immersive-rig.js';import {matIdentity} from './src/immersive-math.js';import {perspective} from './src/vr-math.js';
const $=id=>document.getElementById(id);WEAPONS.forEach((w,i)=>$('weapon').add(new Option(w.name,i)));$('weapon').value='1';let renderer=null,frame=0,live=new Set(),current=null;
function pitch(m,a){const c=Math.cos(a),s=Math.sin(a);m[5]=c;m[6]=s;m[9]=-s;m[10]=c;return m;}
function eyeInverse(head,offset){const m=matIdentity(),position=[head[12]+head[0]*offset,head[13]+head[1]*offset,head[14]+head[2]*offset];for(let c=0;c<3;c++)for(let r=0;r<3;r++)m[c*4+r]=head[r*4+c];for(let r=0;r<3;r++)m[12+r]=-(m[r]*position[0]+m[4+r]*position[1]+m[8+r]*position[2]);return m;}
function pixels(gl){const d=new Uint8Array(1280*720*4);gl.readPixels(0,0,1280,720,gl.RGBA,gl.UNSIGNED_BYTE,d);let left=0,right=0,lit=0;for(let y=0;y<720;y+=4)for(let x=0;x<640;x+=4){const a=(y*1280+x)*4,b=a+2560;left=(Math.imul(left,31)+d[a]+d[a+1]*7+d[a+2]*13)|0;right=(Math.imul(right,31)+d[b]+d[b+1]*7+d[b+2]*13)|0;if(d[a]+d[a+1]+d[a+2]>35)lit++;}return{leftHash:left,rightHash:right,lit,glError:gl.getError()};}
window.disposeEquipment=()=>{if(frame)cancelAnimationFrame(frame);frame=0;renderer?.dispose();renderer=null;current=null;return{liveResources:live.size};};
window.showEquipment=async(config={})=>{
 await document.fonts.load('500 24px Oxanium');await document.fonts.ready;window.disposeEquipment();live=new Set();renderer=new VRWorldRenderer($('world'),{defer:true});const gl=renderer.gl;
 for(const type of ['Buffer','Texture','Program','Shader']){const create=gl['create'+type].bind(gl),remove=gl['delete'+type].bind(gl);gl['create'+type]=(...args)=>{const o=create(...args);if(o)live.add(o);return o;};gl['delete'+type]=o=>{live.delete(o);return remove(o);};}renderer.initialize();
 const game=new Game();game.loadLevel(0,false);game.unlocked=6;game.selectWeapon(Number(config.weapon??1));const rig=new ImmersiveRig(),head=matIdentity(),right=matIdentity(),left=matIdentity(),rightGrip=matIdentity(),posture=config.posture==='standing'?1.75:1.65,pose=config.pose||'combat';
 head[13]=posture;pitch(head,pose==='hands'?-.42:pose==='wrist'?-.15:0);right[12]=.18;right[13]=posture-.27;right[14]=-.42;rightGrip.set(right);left[12]=-.22;left[13]=posture-(pose==='wrist'?.25:pose==='hands'?.28:.69);left[14]=pose==='wrist'?-.45:-.40;if(pose==='hands')pitch(left,.2);if(pose==='wrist')pitch(left,65*Math.PI/180);if(config.leftRoll||config.leftPitch)visualLeftPose(left,left,{vrLeftHandPitch:config.leftPitch||0,vrLeftHandYaw:0,vrLeftHandRoll:config.leftRoll||0});
 // An actual wrist-check pose turns the tracked left controller toward the eyes;
 // a merely raised, unrotated Touch grip must not open the menu.
 const settings={vrWristActivation:config.pin?'manual':'gaze',vrEyeHeight:posture,vrPosture:config.posture||'seated',vrQuality:config.quality||'balanced',reducedMotion:true,vrAimLine:false,vrHandStyle:config.style||'combat',vrWristSize:config.size||.32,vrSubtitleSize:config.subtitleSize||1,vrSubtitleMode:config.subtitleMode||'comfort'},tracked={head,rightRay:right,rightGrip,leftGrip:left,leftRay:left},views=[-.032,.032].map((x,i)=>({viewport:{x:i*640,y:0,width:640,height:720},projectionMatrix:perspective(Math.PI/2,640/720),transform:{inverse:{matrix:eyeInverse(head,x)}}}));
 const spoken=game.events.find(e=>e.type==='dialogue'),dialogue=pose==='dialogue'?(spoken?spoken.speaker+': '+spoken.text:'ORI: Their control signal is muted. Your turn, Michael.'):'',data={game,settings,screen:config.equipmentOnly?'equipment-detail':'',activate:()=>{},dialogue};for(let i=0;i<18;i++){rig.prepare(game,tracked,null,settings,.016);game.update(.016,{deferFire:true});}let frames=0;
 function draw(){if(config.pin&&frames===1)renderer.ui.wrist.togglePin();rig.prepare(game,tracked,null,settings,.016);const stats=renderer.renderWorld(views,game,rig,.016,data);$('wrist').getContext('2d').drawImage(renderer.ui.canvas,0,0,768,512);$('comm').getContext('2d').clearRect(0,0,1280,360);$('comm').getContext('2d').drawImage(renderer.ui.caption,0,0,1280,360);current={pose,leftRoll:config.leftRoll||0,leftPitch:config.leftPitch||0,weapon:game.weapon,style:settings.vrHandStyle,posture:settings.vrPosture,frames:++frames,stats:structuredClone(stats),...pixels(gl),wristOpen:!!renderer.ui.wristPanel,wristWidth:renderer.ui.wristPanel?.width||0,wristHeight:renderer.ui.wristPanel?.height||0,statusVisible:!!renderer.ui.statusPanel,subtitleMode:renderer.ui.captionPlacementMode||'legacy',subtitleCenter:renderer.ui.captionPanel?.center.slice()||null};$('status').textContent=WEAPONS[game.weapon].name+' / '+pose.toUpperCase()+' / '+(current.wristOpen?'WRIST ACTIVE':'COMBAT CLEAR');frame=requestAnimationFrame(draw);}
 draw();await new Promise(resolve=>{function ready(){
  // The new intentional watch gesture requires 350ms of actual tracked-pose
  // dwell. Give production frames enough time to complete it before capture.
  if(frames>=45)resolve();else requestAnimationFrame(ready);
 }ready();});return current;
};
window.equipmentState=()=>current;$('render').onclick=()=>window.showEquipment({pose:$('pose').value,weapon:Number($('weapon').value),style:$('style').value});$('checks').onclick=async()=>{try{const {browserEquipmentChecks}=await import('./tests/equipment-checks.js');const report=await browserEquipmentChecks();$('raw').textContent=JSON.stringify(report,null,2);$('status').textContent=(report.passed?'PASS':'FAIL')+' / '+report.total;}catch(e){$('raw').textContent=JSON.stringify({passed:false,error:e.stack||e.message});}};
</script></html>
