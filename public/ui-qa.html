<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Signal / UI checks</title><style>body{font:15px system-ui;background:#080b21;color:#e4ecff;margin:24px}button{font:inherit;padding:12px 18px;background:#85216c;border:1px solid #e58fc9;color:#fff;margin-right:10px}pre{white-space:pre-wrap;font-size:12px}iframe{border:1px solid #6b75a9;transform-origin:top left;display:block;margin-top:20px}#viewport{height:650px;overflow:auto}canvas{border:1px solid #5c699c;width:45%;height:auto}a{color:#45e7ff}</style><h1>Neon Signal / production UI</h1><p>Automated viewport and interaction checks. Synthetic events; no hardware acceptance claim.</p><button id="run">RUN UI CHECKS</button><button id="vr">PREVIEW VR PANELS</button><a href="./">OPEN GAME</a><p id="status" role="status">Ready.</p><pre id="raw"></pre><div id="panels"></div><div id="viewport"><iframe id="frame" title="Actual production game"></iframe></div><script type="module">
import {uiChecks} from './tests/ui-checks.js';import{VRPanel}from './src/vr-renderer.js';import{WorldUI}from './src/world-ui.js';import{ImmersiveRig}from './src/immersive-rig.js';import{Game}from './src/core.js';
const $=id=>document.getElementById(id);$('run').onclick=async()=>{$('run').disabled=true;try{const data=await uiChecks($('frame'),r=>$('status').textContent=r.length+' checks completed / '+r.filter(x=>!x.pass).length+' failed');$('raw').textContent=JSON.stringify(data,null,2);$('status').textContent=(data.passed?'PASS':'FAIL')+' / '+data.results.filter(r=>r.pass).length+' OF '+data.total+' UI CHECKS';}catch(e){$('raw').textContent=e.stack;$('status').textContent='FAIL / '+e.message;}finally{$('run').disabled=false;}};
$('vr').onclick=async()=>{await document.fonts.ready;const f=new FontFace('Oxanium','url(./fonts/Oxanium.ttf)',{weight:'200 800'});await f.load();document.fonts.add(f);const game=new Game();game.start();const scene=document.createElement('canvas');scene.width=640;scene.height=360;const vr=new VRPanel();vr.paint({game,scene,screen:'pause-screen',items:[],activate:()=>{},dialogue:'ORI: Your frequency is still yours.'});const wrist=new WorldUI();wrist.paint({game,activate:()=>{},dialogue:'ORI: Behind you, Michael!'},new ImmersiveRig(),100);$('panels').replaceChildren(vr.canvas,wrist.canvas);};
</script></html>
